name: Launch gate

on:
  pull_request:
  push:

jobs:
  test:
    name: Launch gate / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
          cache: npm

      - run: npm ci
      - run: npm test
      # Contract suite (docs/sisi-elevate/CONTRACT.md): rebuilds dist the way
      # Netlify production does and checks URLs, SEO, links, the blog pipeline
      # and facts against contract/*.json. --offline: no request leaves the runner.
      - run: npm run contract:prod -- --offline
